<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yipi Bear - Therapeutic Stories for Children</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-gradient-to-b from-pink-50 to-purple-50 min-h-screen">
    <nav class="bg-white shadow-lg">
        <div class="max-w-6xl mx-auto px-4">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center">
                    <a href="/" class="text-2xl font-bold text-purple-600">Yipi Bear</a>
                </div>
                <div class="hidden md:flex space-x-8">
                    <a href="/" class="text-gray-600 hover:text-purple-600">Home</a>
                    <a href="/about" class="text-gray-600 hover:text-purple-600">About</a>
                    <a href="/story-form" class="text-gray-600 hover:text-purple-600">Generate Story</a>
                </div>
                <div class="md:hidden">
                    <button class="mobile-menu-button">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
        <div class="mobile-menu hidden md:hidden">
            <a href="/" class="block py-2 px-4 text-sm hover:bg-purple-100">Home</a>
            <a href="/about" class="block py-2 px-4 text-sm hover:bg-purple-100">About</a>
            <a href="/story-form" class="block py-2 px-4 text-sm hover:bg-purple-100">Generate Story</a>
        </div>
    </nav>

    <main class="container mx-auto px-4 py-8">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-white shadow-lg mt-8">
        <div class="max-w-6xl mx-auto px-4 py-6">
            <div class="text-center text-gray-600">
                <p>&copy; 2024 Yipi Bear. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
